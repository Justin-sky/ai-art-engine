appId: com.aiartengine.app
productName: AIArtEngine
publish:
  provider: github
  owner: Justin-sky
  repo: ai-art-engine
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml}'
  - '!{dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{*.code-workspace}'
  # dsh 及其依赖只进 resources/dsh（系统 Node 执行，asar 内无法读取），避免重复打进 asar
  - '!node_modules/@deepseek-ai/**'
  - '!{.github,.git}'
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: scripts/mcp-bridge.mjs
    to: mcp-bridge.mjs
  # dsh 运行体（DeepSeek Harness）：构建时由 scripts/bundle-dsh.mjs 生成，
  # 运行时由 deepseekHarnessService 用系统 Node 拉起，故放 asar 外、不进 asar。
  # 注意：electron-builder 26 起 copyDir 的 filter 会硬编码丢弃「源根目录下的 node_modules」
  # （app-builder-lib/out/util/filter.js: relative === 'node_modules' → false），
  # 若 from 指向 out/dsh-bundle，其下的 node_modules（约 200MB）会被整个跳过、
  # 只残留根 package.json，导致用户端 dshEntry 解析失败、被迫走 npx 联网下载。
  # 因此 from 直接指向 node_modules 目录，拷贝时源根即目录本身，可绕过该过滤。
  - from: out/dsh-bundle/node_modules
    to: dsh/node_modules
win:
  target:
    - nsis
  # 签名：CI 注入 WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD（.pfx base64）后自动签名
nsis:
  # 禁止空格：NSIS 默认是「AIArtEngine Setup x.y.z.exe」。
  # GitHub Release 会把空格改成点（AIArtEngine.Setup.x.y.z.exe），
  # electron-updater 则按连字符去下（AIArtEngine-Setup-x.y.z.exe）→ 404。
  artifactName: ${productName}-Setup-${version}.${ext}
mac:
  # 同时打 Intel (x64) 与 Apple Silicon (arm64)；仅 arm64 时 Intel Mac 会提示「不支持此应用程序」
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 公证：CI 在配置了 APPLE_* Secrets 时通过 --config.mac.notarize=true 开启
  # 产物名带架构，避免 Intel / Apple Silicon 装错包
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
