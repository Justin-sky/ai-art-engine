extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: scripts/mcp-bridge.mjs
    to: mcp-bridge.mjs
  # dsh 运行体（DeepSeek Harness）：构建时由 scripts/bundle-dsh.mjs 压缩为单个
  # out/dsh-bundle.zip，安装包只带这一文件——NSIS 安装无需逐个写一万三千个文件，
  # 安装秒级完成；首次启动由 deepseekHarnessService.ensureDshUnpacked 解压到
  # 用户数据目录（userData/dsh-runtime），再由系统 Node 拉起，故放 asar 外、不进 asar。
  - from: out/dsh-bundle.zip
    to: dsh/dsh-bundle.zip
win:
  target:
    - nsis
  # 签名：CI 注入 WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD（.pfx base64）后自动签名
nsis:
  # 禁止空格：NSIS 默认是「AIArtEngine Setup x.y.z.exe」。
  # GitHub Release 会把空格改成点（AIArtEngine.Setup.x.y.z.exe），
  # electron-updater 则按连字符去下（AIArtEngine-Setup-x.y.z.exe）→ 404。
  artifactName: ${productName}-Setup-${version}.${ext}
mac:
  # 同时打 Intel (x64) 与 Apple Silicon (arm64)；仅 arm64 时 Intel Mac 会提示「不支持此应用程序」
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 公证：CI 在配置了 APPLE_* Secrets 时通过 --config.mac.notarize=true 开启
  # 产物名带架构，避免 Intel / Apple Silicon 装错包
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
