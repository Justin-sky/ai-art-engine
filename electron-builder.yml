# 主应用为纯 JS（无 node-gyp 原生模块）；node-pty/koffi/sharp 等原生依赖仅供 dsh 运行时
# （系统 Node 执行）使用，其二进制已随 dsh/dsh-bundle.zip 内置，无需为 Electron 重建。
npmRebuild: false
