appId: com.aiartengine.app
productName: AIArtEngine
publish:
  provider: github
  owner: Justin-sky
  repo: ai-art-engine
directories:
  buildResources: build
# mac 未签名分支（无 MAC_CSC_LINK，CI 以 --config.mac.identity=null 打包）的兜底：
# afterPack 阶段对 .app 做 ad-hoc 签名——Apple Silicon 强制 arm64 可执行文件至少要
# 有 ad-hoc 签名，否则产物会被判「已损坏，无法打开」（有正式证书时钩子自动跳过）。
afterPack: scripts/adhoc-sign-mac.cjs
# 主应用为纯 JS（无 node-gyp 原生模块），无需为 Electron 重建。
npmRebuild: false
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml}'
  - '!{dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{*.code-workspace}'
  - '!{.github,.git}'
  # ---- 已内联打进 out/main/index.js 或未启用的云端可选依赖，避免打进 asar ----
  - '!node_modules/@earendil-works/**'
  - '!node_modules/chokidar/**'
  - '!node_modules/readdirp/**'
  - '!node_modules/@aws-crypto/**'
  - '!node_modules/@aws-sdk/client-bedrock-runtime/**'
  - '!node_modules/@aws-sdk/credential-provider-*/**'
  - '!node_modules/@aws-sdk/token-providers/**'
  - '!node_modules/@aws-sdk/nested-clients/**'
  # out 残留与 asar 内重复/开发文件
  - '!resources/**'
  - '!{tests,examples,promotion,website,docs,scripts,packages}/**'
  - '!{glama.json,server.json,oss-website.example.json}'
  - '!tmp-*.json'
  - '!*.tsbuildinfo'
  - '!*.log'
  - '!.aiartengine-tmp'
# onnxruntime-node 含预编译 .node 原生模块（N-API，无需 electron-rebuild），
# 但 .node 文件不能直接从 asar 内 dlopen——需解包到 app.asar.unpacked 供加载。
asarUnpack:
  - node_modules/onnxruntime-node/**
extraResources:
  - from: resources/icon.png
    to: icon.png
  # 随包内置的 YOLO 模型（detect / segment / pose），首次启动同步到模型目录
  - from: resources/yolo-models
    to: yolo-models
  # 随包内置的人脸两段式模型（face-detect / face-landmark）：来自另一套上游，单独目录便于
  # 替换；同样在首次启动同步到模型目录（YoloService.ensureBundledModels 扫这两个目录）
  - from: resources/face-models
    to: face-models
  # 注意：ffmpeg/ffprobe 不再随安装包分发（减小体积）——用户在「设置 → 通用工具 ffmpeg」
  # 面板按需下载到应用私有目录，或自行安装后由 PATH / 环境变量供视频打点、取帧、导出使用。
  - from: scripts/mcp-bridge.mjs
    to: mcp-bridge.mjs
  # 注：Blender 工具面不再需要随包脚本——它是主进程内建的 MCP server（/mcp/blender），
  # 直接以 TCP 连 Blender addon，既不需要 uv/Python，也没有子进程要拉起来。
win:
  target:
    - nsis
  # 签名：CI 注入 WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD（.pfx base64）后自动签名
nsis:
  # 禁止空格：NSIS 默认是「AIArtEngine Setup x.y.z.exe」。
  # GitHub Release 会把空格改成点（AIArtEngine.Setup.x.y.z.exe），
  # electron-updater 则按连字符去下（AIArtEngine-Setup-x.y.z.exe）→ 404。
  artifactName: ${productName}-Setup-${version}.${ext}
mac:
  # 同时打 Intel (x64) 与 Apple Silicon (arm64)；仅 arm64 时 Intel Mac 会提示「不支持此应用程序」
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 公证：CI 在配置了 APPLE_* Secrets 时通过 --config.mac.notarize=true 开启
  # 产物名带架构，避免 Intel / Apple Silicon 装错包
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  # 免安装 AppImage + Debian/Ubuntu 安装包（deb）。
  # deb 安装到 /opt/AIArtEngine，可被 dpkg 干净卸载；CI 会做「安装 → 启动 → 卸载」冒烟。
  target:
    - AppImage
    - deb
deb:
  # deb 控制文件要求 Maintainer；electron-builder 在没有 author.email 时会直接报错。
  maintainer: 'AIArtEngine <aiartengine@users.noreply.github.com>'
  # 24.04 起 libgtk-3-0 / libatspi2.0-0 更名为 *t64，只写旧名会导致 Ubuntu 24.04+
  # `dpkg -i` 依赖不可满足而安装失败，故用 OR 链同时兼容旧新命名。
  depends:
    - libgtk-3-0 | libgtk-3-0t64 | libgtk-4-1
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
