# 多平台 Electron 自动构建 + 可选代码签名
# - push tag v* → 构建并发布 GitHub Release
# - workflow_dispatch → 仅构建 Artifact
#
# 签名（仓库 Settings → Secrets and variables → Actions）：
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
#   macOS:   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD
#   公证:    APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
# 未配置 Secrets 时仍可构建，产物为未签名包。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest 已迁移到 Visual Studio 2026，electron-builder 捆绑的
          # node-gyp 无法识别（"Could not find any Visual Studio installation"），
          # 固定 windows-2022（VS2022）确保 node-pty 等原生依赖可重建
          - os: windows-2022
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Git tag v$TAG must match package.json version $PKG"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # node-pty 等原生依赖经 node-gyp 重建，依赖 Python distutils（3.12+ 已移除）
      # v6 起基于 Node 24（v5 用已弃用的 Node 20，runner 会强制升级并告警）
      - name: Set up Python 3.11 (node-gyp distutils)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build app
        run: npm run build

      # 生成自包含 dsh 运行体（out/dsh-bundle），供 extraResources 打入 <resources>/dsh。
      # 缺少此步会导致安装包无内置 dsh，用户首启走 npx 联网下载（1–2 分钟）。
      - name: Bundle dsh runtime
        run: npm run bundle:dsh

      - name: Package (Windows)
        if: matrix.platform == 'win'
        env:
          # 勿直接注入空 secret：空 WIN_CSC_LINK 会被当成证书路径
          WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${WIN_CSC_LINK_SECRET}" ]; then
            export WIN_CSC_LINK="${WIN_CSC_LINK_SECRET}"
            export WIN_CSC_KEY_PASSWORD="${WIN_CSC_KEY_PASSWORD_SECRET}"
            echo "Windows code signing enabled"
          else
            echo "Unsigned Windows build (no WIN_CSC_* secrets)"
          fi
          npx electron-builder --win --publish never

      - name: Package (macOS)
        if: matrix.platform == 'mac'
        env:
          # 勿直接注入空 CSC_LINK：electron-builder 会把空值当成路径 → "not a file"
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXTRA_ARGS=()
          if [ -n "${MAC_CSC_LINK}" ]; then
            export CSC_LINK="${MAC_CSC_LINK}"
            export CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD}"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            if [ -n "${APPLE_ID}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ] && [ -n "${APPLE_TEAM_ID}" ]; then
              echo "Notarization enabled"
              EXTRA_ARGS+=(--config.mac.notarize=true)
            else
              echo "Signing enabled; notarization skipped (need APPLE_* secrets)"
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            EXTRA_ARGS+=(--config.mac.identity=null)
            # afterPack 钩子会对 .app 做 ad-hoc 签名（arm64 必需），否则 Apple Silicon 上
            # 完全未签名的包会报「已损坏，无法打开」；对外正式分发仍需签名+公证。
            echo "Ad-hoc signed macOS build (no MAC_CSC_* secrets)"
          fi
          # macos-latest 为 arm64；显式打 x64+arm64，供 Intel / Apple Silicon 分别下载
          npx electron-builder --mac --x64 --arm64 --publish never "${EXTRA_ARGS[@]}"

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: aiartengine-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: warn
          retention-days: 30

      # ---- 静默安装 + 启动冒烟（产物先上传，冒烟失败时仍可下载分析）----
      # 任一步失败 → build job 失败 → 依赖它的 release job 不执行，标签不会被发布。
      - name: Smoke test — silent install & launch (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'dist\*-Setup-*.exe' -ErrorAction Stop | Select-Object -First 1
          Write-Host "SMOKE installing: $($setup.Name)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "NSIS silent install failed (exit code $($p.ExitCode))" }

          # NSIS 默认 per-user 安装到 %LOCALAPPDATA%\Programs\<productName>，主程序 AIArtEngine.exe；
          # oneClick 装完会默认自动拉起应用，先清理残余，再手动启动一次做存活检测。
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\AIArtEngine\AIArtEngine.exe'
          if (-not (Test-Path $exe)) {
            # 兜底 1：读 HKCU 卸载注册表 DisplayIcon（记录主程序绝对路径）
            $icon = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
              ForEach-Object { Get-ItemProperty $_.PSPath } |
              Where-Object { $_.DisplayName -eq 'AIArtEngine' -and $_.DisplayIcon } |
              Select-Object -First 1 -ExpandProperty DisplayIcon
            if ($icon) { $exe = ($icon -split ',')[0] }
          }
          if (-not (Test-Path $exe)) {
            # 兜底 2：在安装目录内找主程序（排除卸载器）
            $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs\AIArtEngine') -Filter '*.exe' -ErrorAction SilentlyContinue |
              Where-Object Name -notlike 'Uninstall*' | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) { throw "Installed app not found (last tried: $exe)" }
          Write-Host "SMOKE app exe: $exe"

          # 关闭装完自动拉起的实例并等待完全退出，避免单实例锁导致误判
          Get-Process AIArtEngine -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $deadline = (Get-Date).AddSeconds(15)
          while ((Get-Process AIArtEngine -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (Get-Process AIArtEngine -ErrorAction SilentlyContinue) { throw 'Auto-launched instance still running; abort smoke' }

          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited) {
            Write-Host "SMOKE_FAIL app exited early with code $($app.ExitCode)" -ForegroundColor Red
            exit 1
          }
          Write-Host 'SMOKE_OK app still running after 15s'
          Stop-Process -Id $app.Id -Force

      - name: Smoke test — mount dmg & launch (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          # macos-latest 现为 arm64：优先测本机架构 dmg（Intel 包需 Rosetta，CI 不装，跳过）
          DMG="$(ls dist/*.dmg 2>/dev/null | grep 'arm64' | head -n1 || true)"
          [ -n "$DMG" ] || DMG="$(ls dist/*.dmg 2>/dev/null | head -n1 || true)"
          [ -n "$DMG" ] || { echo 'SMOKE_FAIL no .dmg found' >&2; exit 1; }
          echo "SMOKE dmg: $DMG"
          MNT="$RUNNER_TEMP/aiartengine-dmg"
          OUT="$RUNNER_TEMP/aiartengine-smoke"
          rm -rf "$MNT" "$OUT"
          mkdir -p "$MNT" "$OUT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT" >/dev/null
          cp -R "$MNT"/*.app "$OUT/"
          hdiutil detach "$MNT" >/dev/null
          APP="$(ls -d "$OUT"/*.app | head -n1)"
          BIN="$APP/Contents/MacOS/AIArtEngine"
          [ -x "$BIN" ] || { echo "SMOKE_FAIL binary missing: $BIN" >&2; exit 1; }
          echo "SMOKE launching: $BIN"
          "$BIN" > /tmp/smoke.log 2>&1 &
          PID=$!
          sleep 15
          set +e
          kill -0 "$PID" 2>/dev/null
          ALIVE=$?
          set -e
          if [ "$ALIVE" -eq 0 ]; then
            echo 'SMOKE_OK app still running after 15s'
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            wait "$PID" 2>/dev/null
            RC=$?
            echo "SMOKE_FAIL app exited early (code $RC)" >&2
            cat /tmp/smoke.log >&2
            exit 1
          fi

      - name: Smoke test — run AppImage (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          IMG="$(ls dist/*.AppImage 2>/dev/null | head -n1 || true)"
          [ -n "$IMG" ] || { echo 'SMOKE_FAIL no .AppImage found' >&2; exit 1; }
          echo "SMOKE AppImage: $IMG"
          chmod +x "$IMG"
          # GitHub ubuntu runner 无 FUSE：APPIMAGE_EXTRACT_AND_RUN=1 强制解包运行；
          # Electron 需系统 GUI 库与显示服务器，缺则先补（包名兼容 22.04/24.04 的 t64 迁移）。
          sudo apt-get update -qq
          if ! sudo apt-get install -y -qq xvfb libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
              libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
              libasound2t64 libpango-1.0-0t64 libcairo2 libgtk-3-0t64 libegl1 libgl1 libxss1 libxtst6 libnotify4; then
            sudo apt-get install -y -qq xvfb libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
              libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 \
              libpango-1.0-0 libcairo2 libgtk-3-0 libegl1 libgl1 libxss1 libxtst6 libnotify4 || \
              echo 'WARN: apt GUI libs unavailable; proceeding and relying on preinstalled deps'
          fi
          xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$IMG" --no-sandbox > /tmp/smoke.log 2>&1 &
          PID=$!
          sleep 15
          set +e
          kill -0 "$PID" 2>/dev/null
          ALIVE=$?
          set -e
          if [ "$ALIVE" -eq 0 ]; then
            echo 'SMOKE_OK app still running after 15s'
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            wait "$PID" 2>/dev/null
            RC=$?
            echo "SMOKE_FAIL app exited early (code $RC)" >&2
            cat /tmp/smoke.log >&2
            exit 1
          fi

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AIArtEngine ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
