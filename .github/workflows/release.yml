# 多平台 Electron 自动构建 + 可选代码签名
# - push tag v* → 构建并发布 GitHub Release
# - workflow_dispatch → 仅构建 Artifact
#
# 签名（仓库 Settings → Secrets and variables → Actions）：
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
#   macOS:   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD
#   公证:    APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
# 未配置 Secrets 时仍可构建，产物为未签名包。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest 已迁移到 Visual Studio 2026，electron-builder 捆绑的
          # node-gyp 无法识别（"Could not find any Visual Studio installation"），
          # 固定 windows-2022（VS2022）确保 node-pty 等原生依赖可重建
          - os: windows-2022
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Git tag v$TAG must match package.json version $PKG"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # node-pty 等原生依赖经 node-gyp 重建，依赖 Python distutils（3.12+ 已移除）
      - name: Set up Python 3.11 (node-gyp distutils)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build app
        run: npm run build

      - name: Package (Windows)
        if: matrix.platform == 'win'
        env:
          # 勿直接注入空 secret：空 WIN_CSC_LINK 会被当成证书路径
          WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${WIN_CSC_LINK_SECRET}" ]; then
            export WIN_CSC_LINK="${WIN_CSC_LINK_SECRET}"
            export WIN_CSC_KEY_PASSWORD="${WIN_CSC_KEY_PASSWORD_SECRET}"
            echo "Windows code signing enabled"
          else
            echo "Unsigned Windows build (no WIN_CSC_* secrets)"
          fi
          npx electron-builder --win --publish never

      - name: Package (macOS)
        if: matrix.platform == 'mac'
        env:
          # 勿直接注入空 CSC_LINK：electron-builder 会把空值当成路径 → "not a file"
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXTRA_ARGS=()
          if [ -n "${MAC_CSC_LINK}" ]; then
            export CSC_LINK="${MAC_CSC_LINK}"
            export CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD}"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            if [ -n "${APPLE_ID}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ] && [ -n "${APPLE_TEAM_ID}" ]; then
              echo "Notarization enabled"
              EXTRA_ARGS+=(--config.mac.notarize=true)
            else
              echo "Signing enabled; notarization skipped (need APPLE_* secrets)"
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            EXTRA_ARGS+=(--config.mac.identity=null)
            echo "Unsigned macOS build (no MAC_CSC_* secrets)"
          fi
          # macos-latest 为 arm64；显式打 x64+arm64，供 Intel / Apple Silicon 分别下载
          npx electron-builder --mac --x64 --arm64 --publish never "${EXTRA_ARGS[@]}"

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: aiartengine-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: warn
          retention-days: 30

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AIArtEngine ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
