name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          # onnxruntime-node 的 postinstall 会从 CDN 拉预编译二进制，偶发超时会让整条腿在
          # 装依赖阶段就挂掉（与代码无关；2026-09-13 的 6.1.1 首发就撞上一次）。npm 自带的
          # 重试只覆盖 registry 请求，管不到 postinstall 的下载，这里对整步做有限次重试。
          for attempt in 1 2 3; do
            if npm ci; then break; fi
            if [ "$attempt" = 3 ]; then
              echo '::error::npm ci failed after 3 attempts'
              exit 1
            fi
            echo "npm ci failed (attempt $attempt), retrying in 20s..."
            sleep 20
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check formatting
        run: npm run format:check

      - name: Check hardcoded CJK strings
        run: node scripts/check-hardcoded-cjk.mjs --enforce

      # 官方那 15 条市场工作流的 plan 是从应用内置预设**导出**的（两份拷贝）。这里拉市场
      # 仓库核对平价：只改一边就会红。没有这道检查，内置「一键工作流」与市场装出来的会是
      # **同名同版本却不同的图**，而且两边都不报错 —— 用户只会以为模型不稳定。
      # 与上面的 npm ci 同理：网络步骤做有限次重试，避免偶发抖动把整条腿弄红。
      - name: Check workflow market plan parity
        shell: bash
        run: |
          MARKET_DIR="$RUNNER_TEMP/ai-art-engine-workflow"
          for attempt in 1 2 3; do
            if git clone --depth 1 https://github.com/Justin-sky/ai-art-engine-workflow "$MARKET_DIR"; then break; fi
            if [ "$attempt" = 3 ]; then
              echo '::error::cloning ai-art-engine-workflow failed after 3 attempts'
              exit 1
            fi
            rm -rf "$MARKET_DIR"
            echo "clone failed (attempt $attempt), retrying in 15s..."
            sleep 15
          done
          node scripts/export-market-workflows.mjs --check --dir "$MARKET_DIR"

      - name: Build renderer & main bundles
        run: npm run build

      # 主进程 / preload 的第三方依赖是外置的，若某个包被 electron-builder.yml 从 asar
      # 排除（那份清单按 dsh 依赖闭包审计生成），打包版启动就会 require 不到并挂住 ——
      # 6.1.1 的 chokidar 正是这样让冒烟测试卡在「未就绪」。这里在打包前拦住同类改动。
      - name: Check packaged externals
        run: node scripts/check-pack-externals.mjs
