name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          # onnxruntime-node 的 postinstall 会从 CDN 拉预编译二进制，偶发超时会让整条腿在
          # 装依赖阶段就挂掉（与代码无关；2026-09-13 的 6.1.1 首发就撞上一次）。npm 自带的
          # 重试只覆盖 registry 请求，管不到 postinstall 的下载，这里对整步做有限次重试。
          for attempt in 1 2 3; do
            if npm ci; then break; fi
            if [ "$attempt" = 3 ]; then
              echo '::error::npm ci failed after 3 attempts'
              exit 1
            fi
            echo "npm ci failed (attempt $attempt), retrying in 20s..."
            sleep 20
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check formatting
        run: npm run format:check

      - name: Check hardcoded CJK strings
        run: node scripts/check-hardcoded-cjk.mjs --enforce

      - name: Build renderer & main bundles
        run: npm run build

      # 主进程 / preload 的第三方依赖是外置的，若某个包被 electron-builder.yml 从 asar
      # 排除（那份清单按 dsh 依赖闭包审计生成），打包版启动就会 require 不到并挂住 ——
      # 6.1.1 的 chokidar 正是这样让冒烟测试卡在「未就绪」。这里在打包前拦住同类改动。
      - name: Check packaged externals
        run: node scripts/check-pack-externals.mjs
