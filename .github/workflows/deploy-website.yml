# 将 website/ 静态页部署到 GitHub Pages
# 仓库 Settings → Pages → Source 选「GitHub Actions」

name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 三个 Pages action 均升到 Node 24 运行时（旧版本基于已弃用的 Node 20，runner 会强制升级并告警）：
      # upload-pages-artifact 从 v3 起默认不打隐藏文件（website/ 无点文件，不受影响），v5 内部固定
      # upload-artifact v7；deploy-pages 需与之一同升级到 v5。
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
